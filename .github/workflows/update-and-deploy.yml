# 每日 UTC 00:00（约北京时间 08:00）抓取 GitHub Trending，提交归档并发布到 Pages。
name: Update trending and deploy Pages

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write
  issues: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test parser and generator
        run: npm test

      - name: Fetch trending and generate site
        run: npm run update
        env:
          # 供 GitHub REST API 元数据富集使用（topics/license/作者头像）。
          GITHUB_TOKEN: ${{ github.token }}

      - name: Commit data and generated site
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          DATE="$(date -u +%Y-%m-%d)"
          if git diff --staged --quiet; then
            echo "No data/site changes to commit"
          else
            git commit -m "chore: update trending ${DATE}"
            git push
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # 失败时创建/更新固定标题的告警 issue；下一次成功运行后自动关闭。
  alert:
    name: Update failure alert issue
    needs: [build, deploy]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Close alert issue on success
        if: needs.build.result == 'success' && needs.deploy.result == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          ISSUE="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "每日更新失败") | .number' | head -n 1)"
          if [ -n "$ISSUE" ]; then
            gh issue close "$ISSUE" --comment "今日更新已成功完成，自动关闭本告警。成功运行：${RUN_URL}"
          else
            echo "No open 每日更新失败 issue to close"
          fi

      - name: Create or update alert issue on failure
        if: needs.build.result == 'failure' || needs.deploy.result == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          DATE="$(date -u +%Y-%m-%d)"
          BODY="每日更新失败（${DATE} UTC）。

          失败运行：${RUN_URL}

          请查看该运行的日志定位原因；修复后本 issue 会在下一次成功运行时自动关闭。"
          ISSUE="$(gh issue list --state open --json number,title --jq '.[] | select(.title == "每日更新失败") | .number' | head -n 1)"
          if [ -n "$ISSUE" ]; then
            gh issue comment "$ISSUE" --body "$BODY"
          else
            gh issue create --title "每日更新失败" --body "$BODY"
          fi
